<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xiabi Travels | Reserva tu Próxima Aventura</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { turquesa: '#00afaa', naranja: '#ff9800', oscuro: '#1a1a1a' }
                }
            }
        }
    </script>
    <style>
        .video-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        video { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.6); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .tour-card { transition: transform 0.3s ease; }
        .tour-card:active { transform: scale(0.98); }
    </style>
</head>
<body class="bg-gray-50 font-['Poppins'] text-oscuro overflow-x-hidden">

    <nav class="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-gray-100 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <img src="logoxiabi.jpeg" alt="Xiabi Travels" class="h-10 md:h-12 rounded">
            <a href="https://wa.me/8298362020" class="bg-oscuro text-white px-5 py-2 rounded-full font-black text-[10px] uppercase tracking-wider">Ayuda Chat</a>
        </div>
    </nav>

    <section class="relative h-[70vh] flex items-center justify-center text-center text-white px-6">
        <div class="video-bg">
            <video autoplay loop muted playsinline poster="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200">
                <source src="https://assets.mixkit.co/videos/preview/mixkit-daylight-shot-of-a-beach-with-calm-waters-and-boats-in-the-distance-1457-large.mp4" type="video/mp4">
            </video>
        </div>
        <div class="relative z-10 w-full">
            <h1 class="text-4xl md:text-7xl font-black mb-4 uppercase tracking-tighter leading-none">VIVE TU VIAJE <br><span class="text-turquesa text-5xl md:text-8xl italic">SOÑADO</span></h1>
            <p class="text-sm md:text-lg mb-8 font-light max-w-md mx-auto opacity-90">Selecciona tu fecha y asegura tu cupo hoy mismo.</p>
            <a href="#tours" class="inline-block bg-naranja text-white px-10 py-4 rounded-full font-black text-xs uppercase shadow-2xl animate-bounce">Ver Salidas Disponibles</a>
        </div>
    </section>

    <section id="tours" class="py-12 px-4 bg-white border-b">
        <div class="max-w-7xl mx-auto">
            <h2 class="text-2xl font-black uppercase mb-6 text-center italic">Encuentra tu destino:</h2>
            
            <div class="flex flex-col md:flex-row gap-4">
                <div class="flex-1">
                    <label class="block text-[10px] font-black uppercase text-gray-400 mb-2 ml-1">¿Cuándo quieres viajar?</label>
                    <select id="dateFilter" onchange="applyFilters()" class="w-full bg-gray-50 border border-gray-200 px-4 py-4 rounded-2xl text-xs font-bold uppercase outline-none focus:border-turquesa transition appearance-none">
                        <option value="todos">Cualquier mes de 2026</option>
                        <option value="Marzo">Marzo 2026</option>
                        <option value="Mayo">Mayo 2026</option>
                        <option value="Agosto">Agosto 2026</option>
                        <option value="Septiembre">Septiembre 2026</option>
                    </select>
                </div>
                <div class="flex-1">
                    <label class="block text-[10px] font-black uppercase text-gray-400 mb-2 ml-1">Tipo de destino</label>
                    <div class="flex gap-2">
                        <button onclick="setRegion('todos')" class="reg-btn active flex-1 bg-turquesa text-white py-4 rounded-2xl text-[10px] font-black uppercase border border-transparent">Todos</button>
                        <button onclick="setRegion('internacional')" class="reg-btn flex-1 bg-gray-50 text-gray-500 py-4 rounded-2xl text-[10px] font-black uppercase border border-gray-100">Mundiales</button>
                        <button onclick="setRegion('local')" class="reg-btn flex-1 bg-gray-50 text-gray-500 py-4 rounded-2xl text-[10px] font-black uppercase border border-gray-100">Locales</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section class="py-12 px-4 max-w-7xl mx-auto">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="tours-container">
            
            <div class="tour-card bg-white rounded-[2.5rem] shadow-xl overflow-hidden border border-gray-100" data-region="internacional" data-month="Marzo">
                <div class="relative h-64">
                    <img src="https://images.unsplash.com/photo-1595111397025-10497672224b?auto=format&fit=crop&w=800" class="w-full h-full object-cover">
                    <div class="absolute top-5 left-5 bg-white text-oscuro px-4 py-1 rounded-full text-[10px] font-black uppercase shadow-lg">Marzo 15 - 20</div>
                </div>
                <div class="p-8 text-center">
                    <span class="text-turquesa font-black text-[10px] uppercase tracking-widest">Colombia</span>
                    <h3 class="text-2xl font-black uppercase italic mb-2">Medellín & Guatapé</h3>
                    <p class="text-3xl font-black text-oscuro mb-6">US$645</p>
                    <a href="https://wa.me/8298362020?text=Hola!%20Quiero%20comprar%20el%20tour%20a%20Medellín%20de%20Marzo" class="block w-full bg-naranja hover:bg-turquesa text-white py-4 rounded-2xl font-black text-xs uppercase transition shadow-lg shadow-naranja/20">Comprar por WhatsApp</a>
                </div>
            </div>

            <div class="tour-card bg-white rounded-[2.5rem] shadow-xl overflow-hidden border border-gray-100" data-region="internacional" data-month="Mayo">
                <div class="relative h-64">
                    <img src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=800" class="w-full h-full object-cover">
                    <div class="absolute top-5 left-5 bg-white text-oscuro px-4 py-1 rounded-full text-[10px] font-black uppercase shadow-lg">Mayo 10 - 25</div>
                </div>
                <div class="p-8 text-center">
                    <span class="text-turquesa font-black text-[10px] uppercase tracking-widest">Europa</span>
                    <h3 class="text-2xl font-black uppercase italic mb-2">Europa Soñada</h3>
                    <p class="text-3xl font-black text-oscuro mb-6">US$2,450</p>
                    <a href="https://wa.me/8298362020?text=Hola!%20Quiero%20comprar%20el%20tour%20Europa%20Soñada" class="block w-full bg-naranja hover:bg-turquesa text-white py-4 rounded-2xl font-black text-xs uppercase transition shadow-lg shadow-naranja/20">Comprar por WhatsApp</a>
                </div>
            </div>

        </div>
    </section>

    <footer class="bg-white py-12 text-center border-t border-gray-100">
        <p class="text-[10px] font-black uppercase tracking-[0.4em] text-gray-300 mb-4">Xiabi Travels © 2026</p>
        <div class="flex justify-center gap-6 text-xl text-gray-400">
            <a href="https://www.instagram.com/xiabitravels/"><i class="fab fa-instagram"></i></a>
            <a href="https://wa.me/8298362020"><i class="fab fa-whatsapp"></i></a>
        </div>
    </footer>

    <script>
        let currentRegion = 'todos';

        function setRegion(reg) {
            currentRegion = reg;
            document.querySelectorAll('.reg-btn').forEach(btn => {
                btn.classList.remove('active', 'bg-turquesa', 'text-white');
                btn.classList.add('bg-gray-50', 'text-gray-500');
            });
            event.target.classList.add('active', 'bg-turquesa', 'text-white');
            applyFilters();
        }

        function applyFilters() {
            const selectedMonth = document.getElementById('dateFilter').value;
            const cards = document.querySelectorAll('.tour-card');

            cards.forEach(card => {
                const region = card.getAttribute('data-region');
                const month = card.getAttribute('data-month');
                
                const matchesRegion = (currentRegion === 'todos' || region === currentRegion);
                const matchesMonth = (selectedMonth === 'todos' || month === selectedMonth);

                card.style.display = (matchesRegion && matchesMonth) ? 'block' : 'none';
            });
        }
    </script>
</body>
</html>
